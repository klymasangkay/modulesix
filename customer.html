<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Customer Information Form</title>
        <style>
            body {
                background-image: url(https://media.assettype.com/tribune/2024-02/b22d6864-a1bf-444b-bdc8-671adfb45cb2/Capture.JPG?w=1200&ar=40:21&auto=format%2Ccompress&ogImage=true&mode=crop&enlarge=true&overlay=false&overlay_position=bottom&overlay_width=100);
                background-repeat: no-repeat;
                background-size:cover;
                margin: 0;
                display: flow-root;
                justify-content: center;
                align-items: center;
            }

            .customer-form {
                width: 500px;
                height: 570px;
                display: flex;
                margin: auto;
                margin-top: 1%;
                flex-direction: column;
                justify-content: center;
                padding: 20px;
                border: 20px slategray;
                border-radius: 10px;
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
                background-color: rgba(255, 255, 255, .7);
                background-blend-mode: lighten;
            }

            h1 {
                font-weight: 900;
                font-size: 20px;
                font-family: Arial;
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                top: 10%; 
                color: rgb(0, 0, 0);
            }

            #username-text{
                border-radius: 50px;
                width: 20%;
                height: 25px;   
                font-family: Arial;
                font-weight: bold; 
                padding: 3px;
                position: absolute;
                top:20%;
                left: 50%;
                transform: translateX(-50%);
                
            }

            #password-text{
                border-radius: 50px;
                width: 20%;
                height: 25px;   
                font-family: Arial;
                font-weight: bold; 
                padding: 3px;
                position: absolute;
                top: 27%;
                left: 50%;
                transform: translateX(-50%);
            }

            #label-male {
                font-family: Arial;
                font-weight: bold;
                position: absolute;
                top: 35%;
                left: 39.5%;
            }
 
            #label-female {
                font-family: Arial;
                font-weight: bold; 
                position: absolute;
                top: 39%;
                left: 39.5%;
            }

            #comp{
                font-family: Arial;
                font-weight: bold; 
                position: absolute;
                top: 45%;
                left: 39.6%;
            }

            #infotech{
                font-family: Arial;
                font-weight: bold; 
                position: absolute;
                top: 49%;
                left: 39.6%;
            }
            
            #infosys{
                font-family: Arial;
                font-weight: bold; 
                position: absolute;
                top: 53%;
                left: 39.6%;
            }

            #cities, #cities-label{
                width: 20%;
                height: 25px;   
                font-family: Arial;
                font-weight: bold; 
                padding: 3px;
                position: absolute;
                top: 59%;
                left: 50%;
                transform: translateX(-50%);
            }

            #cities {
                position: absolute;
                top: 63%;
                left: 50%;
                transform: translateX(-50%);
            }

            #yourself {
                display: block;
                width: 95%;
                font-family: Arial;
                font-weight: bold;
                margin-top: 330px;
            }

            #button-container {
                display: flex;
                justify-content: center; 
                margin-top: 20px;
            }

            #submit-button, #clear-button {
                background-color: rgba(30, 165, 3, 0.7);
                color: ghostwhite;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                font-weight: bold;
                font-size: 13px;
                text-align: center;
                width: 120px;
                height: 40px; 
                margin-top: 15px;
                padding: 10px;
                border: none;
                border-radius: 10px;
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.7);
                cursor: pointer;
            }

            #clear-button {
                background-color: rgba(165, 3, 3, 0.7);
            }
            #submit-button:hover {
                background-color: rgb(18, 76, 1);
            }

            #clear-button:hover {
                background-color: rgb(76, 1, 1);
            }
        </style>
        <body>
            <form>
                <div class="customer-form">
                    <h1>CUSTOMER INFORMATION FORM</h1>
                    <input type="text" id="username-text" name="username" placeholder="Username" required>
                    <input type="text" id="password-text" name="password" placeholder="Password" required>
                    <label for="male" id="label-male"><input type="radio" id="male" name="gender" value="male"> Male</label><br>
                    <label for="female" id="label-female"><input type="radio" id="female" name="gender" value="male"> Female</label><br>
                    <label for="cs" id="comp"><input type="checkbox" id="cs" name="Computer Science"> Computer Science</label><br>
                    <label for="it" id="infotech"><input type="checkbox" id="it" name="Information Technology"> Information Technology</label><br>
                    <label for="is" id="infosys"><input type="checkbox" id="is" name="Information System"> Information System</label><br>
                    <label for="cities" id="cities-label">Select a city:</label>
                    <select id="cities" name="cities">
                        <option value="Caloocan">Select a city</option>
                        <option value="Caloocan">Caloocan</option>
                        <option value="Las Piñas">Las Piñas</option>
                        <option value="Makati">Makati</option>
                        <option value="Malabon">Malabon</option>
                        <option value="Mandaluyong">Mandaluyong</option>
                        <option value="Manila">Manila</option>
                        <option value="Marikina">Marikina</option>
                        <option value="Muntinlupa">Muntinlupa</option>
                        <option value="Navotas">Navotas</option>
                        <option value="Parañaque">Parañaque</option>
                        <option value="Pasay">Pasay</option>
                        <option value="Pasig">Pasig</option>
                        <option value="Quezon City">Quezon City</option>
                        <option value="San Juan">San Juan</option>
                        <option value="Taguig">Taguig</option>
                        <option value="Valenzuela">Valenzuela</option>
                    </select>
                    <label for="comments" id="yourself">Tell us about yourself:</label>
                    <textarea id="comments" name="comments" rows="4" cols="50" style="resize: none" placeholder="Tell us about yourself"></textarea>
                    <div class="button-container">
                        <button id="submit-button">SUBMIT</button>
                        <button id="clear-button">CLEAR</button>
                    </div>
                </div>
            </form>
        </body>
</html>
