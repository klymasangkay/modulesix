<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Personal Information</title>
        <style>
            body {
                background-image: url(https://the-post-assets.sgp1.digitaloceanspaces.com/2022/12/PUP_thumbnail.png);
                background-repeat: no-repeat;
                background-size:cover;
                margin: 0;
                display: flow-root;
                justify-content: center;
                align-items: center;
            }

            img {
                height: 80px;
                width: 80px;
                position: absolute;
                top: 1%;
                left: 50%;
                transform: translateX(-50%);
            }

            .tentative-form {
                width: 800px;
                height: 480px;
                margin: auto;
                margin-top: 100px;
                padding: 20px;
                border: 20px slategray;
                border-radius: 10px;
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
                background-color: rgba(255, 255, 255, .7);
                background-blend-mode: lighten;
            }

            h1 {
                font-weight: 900;
                font-size: 20px;
                font-family: Arial;
                color: rgb(0, 0, 0);
                display: block;
                margin-top: 5px;
                text-align: center;
            }

            table {
                display: flex;
                justify-content: center;
            }
            td {
                font-family: Arial;
                font-weight: bold;
                text-align: justify;
                padding-right: 20px;
                padding-left: 20px;
            }
            #lastname, #firstname, #middlename, #address, #number, #gender {
                border: 20px slategray;
                border-radius: 10px;
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
                width: 300px;
                height: 25px;
                margin-bottom: 10px;
                display: flex;
                align-items: center;
            }

            #gender {
                margin-bottom: 25px;
            }

            #submit-button {
                background-color: rgba(30, 165, 3, 0.7);
                color: ghostwhite;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                font-weight: bold;
                font-size: 13px;
                text-align: center;
                width: 120px;
                height: 40px; 
                padding: 10px;
                border: none;
                border-radius: 10px;
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.7);
                cursor: pointer;
                display: block;
                margin: 15px auto;
                margin-top: 25px;
            }

            #submit-button:hover {
                background-color: rgb(18, 76, 1);
            }

        </style>
        <body>
            <form>
                <img src="https://www.pngkey.com/png/full/52-528919_the-pup-logo-polytechnic-university-of-the-philippines.png">
                <div class="tentative-form">
                    <h1>TENTATIVE REGISTRATION FORM</h1>
                    <table>
                        <tr>
                            <td>LAST NAME</td>
                            <td><input type="text" id="lastname" name="last" required></td>
                        </tr>
                        <tr>
                            <td>FIRST NAME</td>
                            <td><input type="text" id="firstname" name="first" required></td>
                        </tr>
                        <tr>
                            <td>MIDDLE NAME</td>
                            <td><input type="text" id="middlename" name="middle" required></td>
                        </tr>
                        <tr>
                            <td>ADDRESS</td>
                            <td><input type="text" id="address" name="add" required></td>
                        </tr>
                        <tr>
                            <td>STUDENT NUMBER</td>
                            <td><input type="text" id="number" name="student" required></td>
                        </tr>
                        <tr>
                            <td>GENDER</td>
                            <td>
                                <select id="gender" name="gen" required>
                                    <option value="">Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label>COURSE</label><br>
                                <label for="webdev" id="course"><input type="radio" id="webdev" name="webbie" value="courseweb"> Web Development</label><br>
                                <label for="hci" id="course"><input type="radio" id="hci" name="human" value="coursehci"> Human Computer Interaction</label><br>
                                <label for="info" id="course"><input type="radio" id="info" name="infom" value="courseinfo"> Information Management</label><br>
                                <label for="oop" id="course"><input type="radio" id="oop" name="object" value="courseoop"> Object Oriented Programming</label><br>
                            </td>
                            <td>
                                <label>SCHEDULE</label><br>
                                <label for="webdev" id="time"><input type="checkbox" id="webdev"> 07:00 AM - 11:00 AM</label><br>
                                <label for="hci" id="time"><input type="checkbox" id="hci"> 11:00 AM - 03:00 PM</label><br>
                                <label for="info" id="time"><input type="checkbox" id="info"> 03: 00 PM - 07:00 PM</label><br>
                                <label for="oop" id="time"><input type="checkbox" id="oop"> 07:00 PM - 11:00 PM</label><br>
                            </td>
                        </tr>
                    </table>
                    <button id="submit-button">SUBMIT</button>
                </div>
            </form>
        </body>
    </head>
</html>
